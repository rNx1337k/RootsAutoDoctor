# Testes automáticos em cada commit e pull request: estilo (Ruff) e os testes todos num Windows, como no PC da
# oficina. Os testes não precisam de carro nem de cabo (simuladores e gravações); a interface corre sem ecrã.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.9
      - run: ruff check .

  tests:
    name: Testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      RAD_NO_UPDATE_CHECK: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependências
        run: python -m pip install -r requirements.txt
      - name: Python portátil das pontes D2XX/J2534
        run: python tools/get_runtime.py
      - name: Testes
        run: python tests/run_all.py
